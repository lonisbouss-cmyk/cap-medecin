name: Fabriquer l'APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer le projet
        run: |
          mkdir app
          cp -r repo/. app/
          rm -rf app/.git app/.github
          cd app && node extras/mkicon.js
      - name: Installer les dependances
        working-directory: app
        run: |
          echo "legacy-peer-deps=true" > .npmrc
          npm install
          npx expo install --fix || true
      - name: Preparer le projet Android
        working-directory: app
        run: CI=1 npx expo prebuild --platform android
      - name: Compiler l'APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Publier le lien de telechargement direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk CAP-Medecin.apk
          gh release delete apk --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create apk CAP-Medecin.apk -R ${{ github.repository }} --title "CAP Medecin pour Android" --notes "Derniere version de l'application Android CAP Medecin." --latest
